name: Build

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
    contents: write
  
defaults:
  run:
    shell: bash
    
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: [ "3.12" ]
    steps:
      - name: Fix AppArmor user namespace issue
        run: sudo apparmor_parser -R /etc/apparmor.d/unprivileged_userns
        
      - uses: actions/checkout@v6
        with:
          repository: 'yoctoproject/poky'
          path: 'poky'
          ref: 'walnascar-5.2.4'
          
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      # - uses: LizardByte/setup-python-action@master
      #   with:
      #     python-version: '2.7'
      - run: |
          sudo apt update && \
          sudo apt install chrpath diffstat
          
      - working-directory: 'poky'
        run: |
          source oe-init-build-env buid-qemuarm && \
          bitbake core-image-minimal-initramfs && \
          runqemu qemuarm -nographic

      - working-directory: 'poky'
        run: |
          ls -R
          
      - working-directory: 'poky/build'
        run: |
          ls -R
          
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: 'poky/build'
          filename: "${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.os }}.zip"
          
      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "poky/build/${{ github.event.repository.name }}-${{ github.ref_name }}-${{ matrix.os }}.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
